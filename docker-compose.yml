services:
  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coloryx-api-prod
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      JWT_SECRET: ${PROD_JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_PROD_DB}?schema=public
    ports:
      - "3000:3000"

  api-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coloryx-api-test
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      JWT_SECRET: ${TEST_JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_TEST_DB}?schema=public
    ports:
      - "3001:3000"

  db:
    image: postgres:16
    container_name: coloryx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_PROD_DB}
    volumes:
      - coloryx_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  coloryx_pgdata: